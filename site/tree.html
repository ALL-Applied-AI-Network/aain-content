<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Content — ALL Applied AI Network</title>
  <meta name="description" content="Curated AI learning paths — we sorted through the best resources that already exist and mapped them into a skill tree you can follow." />
  <meta property="og:title" content="Learning Tree — ALL Applied AI Network" />
  <meta property="og:description" content="Interactive learning curriculum from foundations to advanced applied AI." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./public/all-logo-transparent.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./tree.css" />
  <link rel="stylesheet" href="./curriculum.css" />
</head>
<body class="curriculum-page">
  <div class="tree-page">

    <!-- Navigation -->
    <nav class="nav">
      <div class="nav__inner">
        <a href="./" class="nav__brand">
          <img src="./public/all-logo-transparent.png" alt="ALL Logo" class="nav__logo" />
          <span>ALL Applied AI Network</span>
        </a>
        <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">&#9776;</button>
        <ul class="nav__links" id="nav-links">
        <li><a href="./">Home</a></li>
        <li><a href="./impact.html">The Network</a></li>
        <li><a href="./start-a-chapter.html">Start a Chapter</a></li>
        <li><a href="./tree.html" class="active">Learn</a></li>
        <li><a href="./about.html">About</a></li>
      </ul>
        <div class="nav__cta">
          <a href="https://dashboard.all-ai-network.org/sign-in" class="nav__cta-link" rel="noopener" title="Already have an account?">Sign in</a>
          <a href="./get-started.html" class="nav__cta-btn">Get started &rarr;</a>
        </div>
      </div>
    </nav>

    <div id="curriculum-notice" role="status"></div>
    <main id="curriculum" aria-label="Learning curriculum"><p role="status">Loading lessons…</p></main>
    <div class="node-panel" id="node-panel"></div>
  </div>

  <script>
    // Hide the outer nav when embedded (e.g. iframed into a hub
    // site's Learn page via ?embed=1) — the host site already shows
    // its own nav, so this one would stack a duplicate navbar. Runs
    // synchronously, before the deferred module script below, so the
    // class is set before the nav gets a chance to paint.
    const embedParams = new URLSearchParams(window.location.search);
    if (embedParams.get('embed') === '1') {
      const treePageRoot = document.querySelector('.tree-page');
      if (treePageRoot) treePageRoot.classList.add('is-embed');
    }

    // Mobile nav toggle
    const toggle = document.getElementById('nav-toggle');
    const links = document.getElementById('nav-links');
    if (toggle && links) {
      toggle.addEventListener('click', () => links.classList.toggle('nav__links--open'));
    }
  </script>
  <script type="module" src="./ts/curriculum-page.ts"></script>
</body>
</html>
