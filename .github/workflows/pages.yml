name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Validation ran ONLY on pull_request, and pushes go straight to
      # main — so nothing on the deploy path ever checked the content.
      # That is how half-applied corrections reached production.
      - name: Validate content
        run: npm run validate

      - name: Generate tree.json and manifest.json
        run: |
          npm run generate:tree
          npm run generate:manifest

      - name: Fetch latest hub-template README
        # Toolkit page reads site/public/hub-template-data.json so the
        # docs always reflect the current state of aain-hub-template.
        run: npm run fetch:hub-template

      - name: Build site
        run: npm run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
